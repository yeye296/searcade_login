name: Delete old workflow runs

on:
  workflow_dispatch:
  schedule:
    - cron: '25 0 1 * *' # 每月 1 号 00:10 自动运行

jobs:
  del_runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      # 0. 先拉取代码（防止后续 git 报错）
      - name: Checkout repository
        uses: actions/checkout@v4

      # 步骤 1：彻底清理所有【已禁用/已删除】的工作流记录（保留 0 条）
      - name: Delete all runs for disabled workflows
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 0  # 💡 禁用状态的一条不留，清除后它们会从 GitHub 侧边栏彻底消失
          delete_workflow_by_state_pattern: 'disabled_manually, disabled_inactivity, disabled_fork, deleted'

      # 步骤 2：单独清理【清理脚本自身】，只保留最近 1 次记录
      - name: Keep only 1 run for this cleanup workflow
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 0  # 💡 设为 0，旧的历史全删，跑完后就只剩本次这 1 条
          delete_workflow_pattern: ${{ github.workflow }}  # 💡 自动获取当前工作流的名称/路径

      # 步骤 3：清理【其他激活状态】的工作流，保留最近 7 次记录
      - name: Delete runs for active workflows
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 7  # 💡 其他激活的工作流各保留 7 次
          delete_workflow_by_state_pattern: 'active'

      # 4. 更新保活时间戳并提交推送
      - name: Update keep-alive timestamp
        run: |
          date '+%Y-%m-%d %H:%M:%S' > .keepalive
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .keepalive
          git commit -m "chore: keep repo active [skip ci]" || echo "No changes to commit"
          git push
